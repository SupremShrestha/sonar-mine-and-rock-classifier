{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<section class="panel">
    <h2>Reset your password</h2>
    <p class="hint">Enter the email you signed up with and we'll send you a link to choose a new password.</p>

    <form method="post" class="stack" novalidate>
        {% csrf_token %}
        {% include "partials/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Send reset link</button>
    </form>

    <p class="hint"><a href="{% url 'login' %}">Back to log in</a></p>
</section>
{% endblock %}
