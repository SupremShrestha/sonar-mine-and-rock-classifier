{% if form.non_field_errors %}
    <div class="alert alert-error">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <div class="field-help">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
        <ul class="errors">
            {% for e in field.errors %}<li>{{ e }}</li>{% endfor %}
        </ul>
    {% endif %}
{% endfor %}
